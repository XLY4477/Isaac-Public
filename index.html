<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07111c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Isaac"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' blob:; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" href="./icon-180.png"><link rel="apple-touch-icon" href="./icon-180.png"><link rel="stylesheet" href="./style.css"><title>Isaac</title><script src="./ruffle-config.js"></script><script defer src="./ruffle/ruffle.js"></script><script defer src="./app.js"></script></head>
<body><header class="topbar"><div class="brand"><img class="mark" src="./icon-180.png" alt=""><span><b>Isaac</b><small>OFFLINE WEB APP</small></span></div><div class="top-actions"><span id="netStatus" class="net-status">准备中</span><button id="fullBtn" class="icon-button" aria-label="Fullscreen">⛶</button><button id="settingsBtn" class="icon-button settings-trigger" aria-expanded="false" aria-label="Settings">⚙ <span>设置</span></button></div></header>
<main id="stage" aria-label="游戏画面"><div id="gameFrame"></div><div id="loading" class="loading"><span class="spinner"></span><b>正在载入游戏</b><small>首次加载需要一点时间</small></div>
<div id="controls" class="controls" hidden><div id="moveStick" class="stick" data-widget="move" aria-label="移动摇杆"><div class="track"><i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i><i class="center-dot"></i><i class="knob"></i></div><label>移动</label></div><div id="shootStick" class="stick" data-widget="shoot" aria-label="射击摇杆"><div class="track"><i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i><i class="center-dot"></i><i class="knob"></i></div><label>射击</label></div><button class="hud-hit" data-widget="bomb" data-key="KeyE" aria-label="炸弹"></button><button class="hud-hit" data-widget="card" data-key="KeyQ" aria-label="卡牌或药丸"></button><button class="hud-hit" data-widget="active" data-key="Space" aria-label="主动道具"></button></div>
<div id="settings" class="settings" hidden><div class="settings-head"><div><small>CONTROL CENTER</small><b>游戏设置</b></div><button id="closeSettings" class="close-button" aria-label="关闭">×</button></div><div class="settings-info"><i></i><span id="privacyStatus">游戏文件仅从当前网页来源读取</span></div><label class="slider-row"><span>操控透明度 <output id="opacityText">48%</output></span><input id="opacityRange" type="range" min="0" max="85" value="48"><small>0% 完全隐形，但仍可触控</small></label><label class="slider-row"><span>摇杆大小 <output id="sizeText">128</output></span><input id="sizeRange" type="range" min="96" max="170" value="128"></label><div class="setting-actions"><button id="visibilityBtn">隐藏摇杆</button><button id="layoutBtn" class="primary">按键位置编辑</button><button id="resetBtn">恢复默认位置</button></div><div class="privacy-note">本页仅访问本站文件；设置保存在本机浏览器。游戏存档由本地运行器保存在本站来源下。</div></div>
<div id="layoutEditor" class="layout-editor" hidden><div class="editor-panel"><div class="editor-toolbar"><b>自定义方案</b><button id="editorExit">离开</button><button id="editorReset">恢复默认</button><button id="editorSave" class="save">保存</button></div><div class="widget-picker" aria-label="选择要调整的控件"><button data-select-widget="move">移动</button><button data-select-widget="shoot">射击</button><button data-select-widget="bomb">炸弹</button><button data-select-widget="card">卡牌 / 药丸</button><button data-select-widget="active">主动道具</button></div><div class="editor-body"><div class="editor-sliders"><label><span>大小 <output id="editorSize">128 px</output></span><input id="editorSizeRange" type="range" min="48" max="210" value="128"></label><label><span>透明度 <output id="editorOpacity">48%</output></span><input id="editorOpacityRange" type="range" min="0" max="100" value="48"></label><small id="selectedName">正在调整：移动摇杆</small></div><div class="nudge"><button data-nudge="0,-1" aria-label="上移">▲</button><button data-nudge="-1,0" aria-label="左移">◀</button><button data-nudge="1,0" aria-label="右移">▶</button><button data-nudge="0,1" aria-label="下移">▼</button></div></div></div><div class="editor-tip">选控件后拖动定位；滑杆调大小和透明度，方向键微调。保存后下次自动使用。</div></div>
<div id="portraitNotice" class="portrait-notice"><span>↻</span><b>请将手机横过来</b><small>横屏后显示游戏与双摇杆</small></div><div id="error" class="error" hidden></div></main></body></html>
