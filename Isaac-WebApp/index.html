<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07111c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="以撒永恒">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./style.css">
  <title>以撒永恒 · 离线版</title>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      ...(window.RufflePlayer.config || {}),
      autoplay: "on",
      letterbox: "on",
      scale: "showAll",
      quality: "high",
      showSwfDownload: false,
      allowFullscreen: true,
      unmuteOverlay: "hidden",
      preferredRenderer: "wgpu-webgl",
      logLevel: "info"
    };
  </script>
  <script defer src="./vendor/ruffle/ruffle.js"></script>
  <script defer src="./app.js?roomtest-cache-bust=1"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><img src="./icons/icon-180.png" alt="" width="30" height="30"><div><strong>以撒永恒</strong><small>离线 Web App</small></div></div>
      <div class="top-actions"><button id="settingsToggle" class="toolbar-button settings-toggle" type="button" aria-expanded="false" aria-controls="settingsPanel">⚙ 设置</button></div>
    </header>
    <section id="settingsPanel" class="settings-panel" hidden aria-label="游戏设置">
      <div class="settings-heading"><strong>设置</strong><button id="closeSettings" type="button" aria-label="关闭设置">×</button></div>
      <span id="connection" class="status-chip"><i></i> 正在检查</span>
      <div id="storageStatus" class="storage-status">网页存档：检查中</div>
      <div class="settings-actions">
        <button id="saveExport" type="button">导出存档</button><button id="saveImport" type="button">导入存档</button>
        <button id="requestStorage" type="button">保护存档</button><button id="toggleControls" type="button">隐藏摇杆</button>
        <button id="toggleHelperUI" type="button">打开道具辅助面板</button>
        <input id="backupFile" type="file" accept="application/json,.json" hidden>
      </div>
      <label class="setting-range"><span>摇杆透明度 <output id="opacityValue">48%</output></span><input id="joystickOpacity" type="range" min="20" max="85" value="48"></label>
      <label class="setting-range"><span>摇杆大小 <output id="sizeValue">128 px</output></span><input id="joystickSize" type="range" min="96" max="170" value="128"></label>
      <label class="setting-check"><input id="showItemZones" type="checkbox"><span>显示物品点击位置（校准用）</span></label>
    </section>
    <main id="gameArea">
      <div id="playerHost" aria-label="以撒永恒游戏画面">
        <section id="welcome" class="welcome-card">
          <div class="heart-mark"><img src="./icons/icon-180.png" alt=""></div>
          <p class="eyebrow">SAFARI 离线游戏</p>
          <h1>以撒的结合：羔羊永恒</h1>
          <p class="welcome-copy">游戏、运行面板和资源都在本地运行。首次启动会缓存约 43 MB 游戏文件及运行组件。</p>
          <div class="download-progress"><span id="downloadBar"></span></div>
          <div id="welcomeStatus" class="welcome-status">准备启动…</div>
          <button id="startGame" class="primary-button" type="button">开始游戏</button>
          <p class="install-note">安装：Safari 分享按钮 → 添加到主屏幕。缓存完成后可离线打开。</p>
        </section>
        <div id="gameError" class="game-error" hidden></div>
      </div>
      <div id="touchLayer" class="touch-layer" hidden aria-label="触控操作">
        <div id="moveStick" class="virtual-stick move-stick" role="application" aria-label="移动摇杆，拖动控制方向"><div class="stick-ring"><span class="stick-dot"></span><span class="stick-knob" aria-hidden="true"></span></div><span class="stick-caption">移动</span></div>
        <div id="shootStick" class="virtual-stick shoot-stick" role="application" aria-label="射击摇杆，拖动控制方向"><div class="stick-ring"><span class="stick-dot"></span><span class="stick-knob" aria-hidden="true"></span></div><span class="stick-caption">射击</span></div>
        <button class="item-hit bomb-hit" data-key="KeyE" data-label="炸弹" type="button" aria-label="点击游戏中的炸弹图标以放置炸弹" title="炸弹：点击游戏内炸弹图标"></button>
        <button class="item-hit card-hit" data-key="KeyQ" data-label="卡牌 / 药丸" type="button" aria-label="点击游戏中的卡牌或药丸图标以使用" title="卡牌或药丸：点击游戏内对应图标"></button>
        <button class="item-hit active-hit" data-key="Space" data-label="主动道具" type="button" aria-label="点击游戏中的主动道具图标以使用" title="主动道具：点击游戏内主动道具图标"></button>
      </div>
      <div id="portraitNotice" class="portrait-notice"><span>↻</span><b>请将手机横过来</b><small>横屏后显示完整游戏画面和触控按键</small></div>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
